<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de compras</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script/produtosDoCardápio.js" defer></script>
    <script src="../script/sacolaDosPedidos.js" defer></script>
</head>
<body>
    <h2 class="tituloCarrinho">Seu carrinho</h2>
    <div class="qtdItensCarrinho">
        <img src="../src/itensDaSacola.png">
        <p id="QtdItensSacola">0 produtos adicionados</p>
    </div>
    
    <div class="sacolaCarrinho">
        <!-- Onde os produtos serão renderizados -->
        <div id="itensCarrinho"></div>


        <div>
            <div class="adicionarCupom" onclick="alternarCupom()">
                <img src="../src/cupomDeDesconto.png" alt="Cupom">
                <p>Adicionar cupom de desconto</p>
                <img src="../src/flechaBaixo.png" class="iconeFlecha" alt="Flecha">
            </div>
            <div id="campoCupom" class="inserirCodigo">
                <p>Tem um cupom? Insira aqui!</p>
                <div class="inputGrupo">
                    <input type="text" id="cupomTexto" placeholder="Digite o código do cupom">
                    <button onclick="validarCupom()">Aplicar</button>
                </div>
                <div id="mensagemCupom" class="mensagem-cupom"></div>
            </div>
        </div>


        <!-- Resumo de Valores -->
        <div class="valoresResumo">
            <div class="valores">
                <p>Subtotal:</p> 
                <span id="subtotalValor">R$ 0,00</span></div>
            <div class="valores">
                <p>Entrega: </p>
                <span id="entregaValor">R$ 0,00</span></div>
            <div class="valores">
                <p>Desconto: </p>
                <span id="descontoValor">R$ 0,00</span></div>
            <!-- ADICIONADO: Linha do Total Geral -->
            <div class="valores valorTotal">
                <p><strong>Total:</strong></p>
                <span id="totalValor">R$ 0,00</span></div>
        </div>

        <!-- ADICIONADO: Botão para prosseguir para o pagamento -->
        <div class="botoesCarrinho">
            <button onclick="cancelarPedido()" class="botaoCancelar">Cancelar pedido</button>
            <button onclick="irParaPagamento()" class="botaoFinalizar">Continuar pedido</button>
        </div>
    </div>
</body>
</html>
